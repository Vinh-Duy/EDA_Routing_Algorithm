name: EDA validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Build and run core tests
        env:
          EDA_CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          "$EDA_CXX" --version | tee build/ci-logs/compiler.txt
          python --version | tee build/ci-logs/python.txt
          make clean
          make CXX="$EDA_CXX" PYTHON=python 2>&1 | tee build/ci-logs/build.log
          make test CXX="$EDA_CXX" PYTHON=python 2>&1 | tee build/ci-logs/tests.log
          python tests/smoke_cli.py 2>&1 | tee build/ci-logs/smoke.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: correctness-${{ matrix.compiler }}
          path: |
            build/ci-logs/
            build/router-build.json
            build/cli-smoke-*/
          retention-days: 14
          if-no-files-found: warn

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang make
      - name: Address and undefined behavior sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          clang++ --version | tee build/ci-logs/compiler.txt
          make sanitize CXX=clang++ 2>&1 | tee build/ci-logs/sanitizers.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitizers
          path: build/ci-logs/
          retention-days: 14
          if-no-files-found: warn

  visualization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Plotly without a browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          make PYTHON=python 2>&1 | tee build/ci-logs/build.log
          python -m unittest discover -s tests -p test_cli.py -v 2>&1 | tee build/ci-logs/visualization.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visualization
          path: build/ci-logs/
          retention-days: 14
          if-no-files-found: warn
